<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title> Video Collections </title>
  <link rel="shortcut icon" href="img/logo.png" type="image/x-icon">

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .img-fade {
      opacity: 0;
      transform: translateY(6px);
      transition: opacity .35s ease, transform .35s ease;
    }
    .img-fade.loaded {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-900">

  <main class="max-w-6xl mx-auto p-4 sm:p-6">
    <header class="mb-6 text-center">
      <h1 class="text-2xl sm:text-3xl font-semibold">Video Collections</h1>
      <p class="text-sm text-gray-600 mt-1">Tap a video to open fullscreen.</p>
    </header>

    <!-- PHOTO GALLERY -->
    <section id="gallery" class="grid gap-4 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 mb-10">
      <!-- (Your 24 photo items remain unchanged here) -->
      <!-- For brevity, not repeating your previous photos -->
    </section>

    <!-- VIDEO GALLERY -->
    <h2 class="text-xl sm:text-2xl font-semibold mt-10 mb-4 text-center">Video Gallery</h2>
    <section id="videoGallery" class="grid gap-4 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3">
      <!-- 12 Videos -->
      <figure class="group relative overflow-hidden rounded-lg bg-white shadow-sm">
        <video src="https://www.pexels.com/download/video/854747/" class="w-full h-48 object-cover cursor-pointer" muted autoplay loop></video>
        <figcaption class="p-3 text-sm text-gray-700">Ocean waves</figcaption>
      </figure>

      <figure class="group relative overflow-hidden rounded-lg bg-white shadow-sm">
        <video src="https://www.pexels.com/download/video/34643969/" class="w-full h-48 object-cover cursor-pointer" muted autoplay loop></video>
        <figcaption class="p-3 text-sm text-gray-700">Forest waterfall</figcaption>
      </figure>

      <figure class="group relative overflow-hidden rounded-lg bg-white shadow-sm">
        <video src="https://www.pexels.com/download/video/11680561/" class="w-full h-48 object-cover cursor-pointer" muted autoplay loop></video>
        <figcaption class="p-3 text-sm text-gray-700">Night city traffic</figcaption>
      </figure>

      <figure class="group relative overflow-hidden rounded-lg bg-white shadow-sm">
        <video src="https://www.pexels.com/download/video/34570729/" class="w-full h-48 object-cover cursor-pointer" muted autoplay loop></video>
        <figcaption class="p-3 text-sm text-gray-700">Rain on window</figcaption>
      </figure>

      <figure class="group relative overflow-hidden rounded-lg bg-white shadow-sm">
        <video src="https://www.pexels.com/download/video/4275461/" class="w-full h-48 object-cover cursor-pointer" muted autoplay loop></video>
        <figcaption class="p-3 text-sm text-gray-700">Desert dunes</figcaption>
      </figure>

      <figure class="group relative overflow-hidden rounded-lg bg-white shadow-sm">
        <video src="https://www.pexels.com/download/video/3694945/" class="w-full h-48 object-cover cursor-pointer" muted autoplay loop></video>
        <figcaption class="p-3 text-sm text-gray-700">Sunset sky</figcaption>
      </figure>

      <figure class="group relative overflow-hidden rounded-lg bg-white shadow-sm">
        <video src="https://www.pexels.com/download/video/3615882/" class="w-full h-48 object-cover cursor-pointer" muted autoplay loop></video>
        <figcaption class="p-3 text-sm text-gray-700">Snow mountains</figcaption>
      </figure>

      <figure class="group relative overflow-hidden rounded-lg bg-white shadow-sm">
        <video src="https://www.pexels.com/download/video/8442494/" class="w-full h-48 object-cover cursor-pointer" muted autoplay loop></video>
        <figcaption class="p-3 text-sm text-gray-700">Bridge over river</figcaption>
      </figure>

      <figure class="group relative overflow-hidden rounded-lg bg-white shadow-sm">
        <video src="https://www.pexels.com/download/video/1826896/" class="w-full h-48 object-cover cursor-pointer" muted autoplay loop></video>
        <figcaption class="p-3 text-sm text-gray-700">City skyline</figcaption>
      </figure>

      <figure class="group relative overflow-hidden rounded-lg bg-white shadow-sm">
        <video src="https://www.pexels.com/download/video/34532087/" class="w-full h-48 object-cover cursor-pointer" muted autoplay loop></video>
        <figcaption class="p-3 text-sm text-gray-700">Clouds timelapse</figcaption>
      </figure>

      <figure class="group relative overflow-hidden rounded-lg bg-white shadow-sm">
        <video src="https://www.pexels.com/download/video/10079386/" class="w-full h-48 object-cover cursor-pointer" muted autoplay loop></video>
        <figcaption class="p-3 text-sm text-gray-700">Night stars</figcaption>
      </figure>

      <figure class="group relative overflow-hidden rounded-lg bg-white shadow-sm">
        <video src="https://www.pexels.com/download/video/3958126/" class="w-full h-48 object-cover cursor-pointer" muted autoplay loop></video>
        <figcaption class="p-3 text-sm text-gray-700">City fountain</figcaption>
      </figure>
    </section>
  </main>

  <!-- Lightbox for Images -->
  <div id="lightbox" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 p-4">
    <div class="relative max-w-4xl w-full">
      <button id="closeBtn" class="absolute right-2 top-2 text-white bg-black/40 rounded-full p-2 hover:bg-black/60" aria-label="Close">✕</button>
      <div class="bg-gray-900/80 rounded-lg overflow-hidden">
        <img id="lightboxImg" src="" alt="" class="w-full max-h-[80vh] object-contain bg-black">
        <div id="lightboxCaption" class="p-3 text-sm text-white/90"></div>
      </div>
      <button id="prevBtn" class="absolute left-2 top-1/2 -translate-y-1/2 text-white bg-black/40 rounded-full p-2 hover:bg-black/60">◀</button>
      <button id="nextBtn" class="absolute right-2 top-1/2 -translate-y-1/2 text-white bg-black/40 rounded-full p-2 hover:bg-black/60">▶</button>
    </div>
  </div>

  <!-- Lightbox for Videos -->
  <div id="videoLightbox" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/80 p-4">
    <div class="relative max-w-4xl w-full">
      <button id="closeVideoBtn" class="absolute right-2 top-2 text-white bg-black/40 rounded-full p-2 hover:bg-black/60" aria-label="Close">✕</button>
      <video id="lightboxVideo" controls autoplay class="w-full max-h-[80vh] rounded-lg bg-black"></video>
    </div>
  </div>

  <footer class="max-w-6xl mx-auto mt-12 p-6 text-center text-gray-600 text-sm border-t border-gray-300">
    <p>&copy; 2025 Photo & Video Gallery. All rights reserved.</p>
  </footer>

  <script>
    // Image lightbox
    (() => {
      const gallery = Array.from(document.querySelectorAll('#gallery figure img'));
      const lightbox = document.getElementById('lightbox');
      const imgEl = document.getElementById('lightboxImg');
      const captionEl = document.getElementById('lightboxCaption');
      const closeBtn = document.getElementById('closeBtn');
      const prev = document.getElementById('prevBtn');
      const next = document.getElementById('nextBtn');
      let i = 0;
      function open(index) {
        const img = gallery[index];
        imgEl.src = img.src || img.dataset.src;
        captionEl.textContent = img.dataset.caption || img.alt;
        lightbox.classList.replace('hidden', 'flex');
        i = index;
      }
      function close() { lightbox.classList.replace('flex', 'hidden'); imgEl.src = ''; }
      function prevImg() { open((i - 1 + gallery.length) % gallery.length); }
      function nextImg() { open((i + 1) % gallery.length); }
      gallery.forEach((g, index) => g.addEventListener('click', () => open(index)));
      closeBtn.onclick = close;
      prev.onclick = prevImg;
      next.onclick = nextImg;
      document.addEventListener('keydown', e => {
        if (lightbox.classList.contains('flex')) {
          if (e.key === 'Escape') close();
          if (e.key === 'ArrowLeft') prevImg();
          if (e.key === 'ArrowRight') nextImg();
        }
      });
      lightbox.addEventListener('click', e => { if (e.target === lightbox) close(); });
    })();

    // Video lightbox
    (() => {
      const videoGallery = document.querySelectorAll('#videoGallery video');
      const videoLightbox = document.getElementById('videoLightbox');
      const videoEl = document.getElementById('lightboxVideo');
      const closeVideoBtn = document.getElementById('closeVideoBtn');
      videoGallery.forEach(v => {
        v.addEventListener('click', () => {
          videoEl.src = v.src;
          videoLightbox.classList.replace('hidden', 'flex');
        });
      });
      closeVideoBtn.onclick = () => {
        videoEl.pause();
        videoEl.src = '';
        videoLightbox.classList.replace('flex', 'hidden');
      };
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && videoLightbox.classList.contains('flex')) {
          videoEl.pause();
          videoEl.src = '';
          videoLightbox.classList.replace('flex', 'hidden');
        }
      });
      videoLightbox.addEventListener('click', e => {
        if (e.target === videoLightbox) {
          videoEl.pause();
          videoEl.src = '';
          videoLightbox.classList.replace('flex', 'hidden');
        }
      });
    })();
  </script>
</body>
</html>
